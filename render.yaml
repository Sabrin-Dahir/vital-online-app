# Render Blueprint — https://github.com/Sabrin-Dahir/vital-online-app
# Dashboard → New → Blueprint → select this repo
#
# After deploy, set in the Render dashboard (Environment):
#   MONGO_URI          → Atlas connection string (vitalguide)
#   JWT_SECRET         → strong random secret
#   CLIENT_URL         → your Vercel frontend URL (e.g. https://….vercel.app)
#   PUBLIC_WEB_URL     → same as CLIENT_URL
services:
  - type: web
    name: vital-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: ALLOW_RENDER_ORIGINS
        value: "true"
      - key: ALLOW_VERCEL_ORIGINS
        value: "true"
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      # IANA timezone for meal reminder HH:MM matching (e.g. Asia/Jerusalem)
      - key: DIET_REMINDER_TZ
        sync: false
